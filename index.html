/* ---------- ornate gold HUD (golden-afternoon style) ---------- */
.hud { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-weight:700; }
.hud .panel-dark, .hud .orn { color:#fbf3df; border:2px solid transparent; border-radius:10px;
  background: linear-gradient(180deg, rgba(40,36,44,.93), rgba(24,22,28,.93)) padding-box,
              linear-gradient(180deg, #f6e0a0, #c8963c 45%, #8a5f1c 55%, #e8c46c) border-box;
  box-shadow: 0 4px 10px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,226,150,.18), inset 0 10px 18px rgba(255,255,255,.04); }
.charpanel { left:14px; top:14px; width:360px; padding:12px 16px 12px 104px; min-height:96px; }
.charpanel::after { content:""; position:absolute; right:-7px; top:50%; width:12px; height:12px; transform:translateY(-50%) rotate(45deg); background:linear-gradient(135deg,#f6e0a0,#a06a10); border:1px solid #5a3a10; }
.badge { left:-6px; top:-6px; width:100px; height:100px; border:4px solid #e2bd62 !important; box-shadow:0 0 0 3px #5a3a10, 0 4px 10px rgba(0,0,0,.5); background-size:296px auto; }
.badge span { display:none; }
.lv { left:12px; top:84px; width:70px; padding:1px 0; font-size:15px; color:#f6e0a0; border-radius:12px; border:2px solid #d6ac54; background:linear-gradient(#3a3240,#1c1a22); box-shadow:0 2px 4px rgba(0,0,0,.5); }
.cname { font-size:21px; margin-bottom:6px; text-shadow:0 2px 0 rgba(0,0,0,.6); } .cname small { color:#f0c75e; font-size:15px; margin-left:8px; }
.hud .bar { height:22px; background:linear-gradient(#141218,#2a2630); border:1px solid #7a5a24; border-radius:11px; box-shadow:inset 0 2px 3px rgba(0,0,0,.7); margin-top:5px; }
.hud .bar i, .hud .bar b { top:1px; bottom:1px; border-radius:10px; }
.hud .bar.hp i { background:linear-gradient(#ff8a78 0%, #e8483a 45%, #b02a22 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
.hud .bar.sp i { background:linear-gradient(#8ad4ff 0%, #3a8ee0 45%, #1f58a8 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
.hud .bar span { font-size:14px; line-height:22px; font-weight:700; }
.topright { right:14px; top:14px; padding:8px 12px 10px; text-align:center; min-width:380px; }
.topright .zone { display:inline-block; font-size:19px; color:#fbf3df; text-shadow:0 2px 0 rgba(0,0,0,.6); }
.topright .gold { display:inline-block; float:right; font-size:18px; margin:0 0 8px; color:#fbf3df; }
.topright .gold::before { content:""; display:inline-block; width:18px; height:18px; margin-right:6px; vertical-align:-3px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff2b0, #e8b440 45%, #a06a10); box-shadow:0 0 0 1px #6a4410; }
.menubtns { gap:6px; clear:both; justify-content:center; }
.hud .menubtns .btn { width:64px; min-height:62px; padding:4px 0 3px; border:2px solid transparent; border-image:none; border-radius:8px; font-size:13px; color:#fbf3df; text-shadow:0 1px 0 #000;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px;
  background: linear-gradient(180deg, #4a4252, #24202a) padding-box, linear-gradient(180deg, #f6e0a0, #a06a10) border-box; box-shadow:0 3px 6px rgba(0,0,0,.5); }
.hud .menubtns .btn:hover { filter:brightness(1.15); }
.hud .menubtns .btn svg { width:30px; height:30px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
.tracker { right:14px; top:136px; width:380px; padding:10px 40px 10px 14px; font-size:14px; font-weight:500; }
.tracker .gold { color:#f6c64e; font-size:17px; font-weight:700; }
.tracker > b.gold:first-child::before { content:"!"; display:inline-block; width:22px; height:22px; margin-right:8px; border-radius:50%; text-align:center; line-height:22px; font-size:15px; color:#2a1a08; background:radial-gradient(circle at 35% 35%, #fff2b0, #e8b440 55%, #a06a10); box-shadow:0 0 0 2px #5a3a10; vertical-align:1px; }
.tracker::after { content:"›"; position:absolute; right:12px; top:50%; transform:translateY(-55%); font-size:34px; color:#fbf3df; font-weight:400; }
.expbar { left:50%; right:auto; width:min(580px, 46vw); transform:translateX(-50%); bottom:8px; height:24px; border-radius:12px; border:2px solid transparent;
  background: linear-gradient(#1c1a20, #2c2832) padding-box, linear-gradient(180deg, #f6e0a0, #a06a10) border-box; box-shadow:0 3px 8px rgba(0,0,0,.5); overflow:hidden; }
.expbar::before, .expbar::after { content:""; position:absolute; top:50%; width:10px; height:10px; transform:translateY(-50%) rotate(45deg); background:linear-gradient(135deg,#f6e0a0,#a06a10); z-index:1; }
.expbar::before { left:4px; } .expbar::after { right:4px; }
.expbar i { top:2px; bottom:2px; left:2px; border-radius:10px; background:linear-gradient(#ffe9a0,#d6a440 50%,#a07020); }
.expbar span { font-size:15px; line-height:20px; color:#fbf3df; font-weight:700; text-shadow:0 1px 0 #000, 0 0 3px #000; }
/* round action buttons: dark enamel with a gold rim, key tag in a gold-edged pill */
.abtn { background: radial-gradient(circle at 50% 30%, #4a4258 0%, #221e2a 62%, #141218 100%) !important; border:3px solid #d8b058;
  box-shadow:0 0 0 2px #4a2f0c, 0 4px 10px rgba(0,0,0,.55), inset 0 0 10px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,240,200,.18); }
.abtn.big { border-width:4px; background: radial-gradient(circle at 50% 30%, #3a5a78 0%, #1a2a3c 60%, #0e141c 100%) !important; }
.abtn.ult { border-color:#e0a8ff; box-shadow:0 0 0 2px #4a2060, 0 0 14px rgba(190,120,255,.45), inset 0 0 10px rgba(0,0,0,.7); }
.abtn .key { left:auto; right:-6px; top:auto; bottom:-6px; min-width:22px; text-align:center; font-size:13px; font-weight:700; color:#fbf3df; padding:1px 5px; border-radius:6px;
  border:1px solid #d6ac54; background:linear-gradient(#3a3240,#16141a); font-family:"Noto Sans KR","Noto Sans CJK KR",sans-serif; }
.abtn .ic { border-radius:50%; overflow:hidden; } .abtn .ic img, .abtn .ic canvas { border-radius:50%; }
.icon.svgic { background:none !important; }
.abtn .sub { right:auto; left:-4px; bottom:-6px; font-size:13px; font-weight:700; color:#bfe4ff; font-family:"Noto Sans KR","Noto Sans CJK KR",sans-serif; text-shadow:0 1px 0 #000, 0 0 3px #000; }
.toast { color:#fbf3df !important; border:2px solid transparent !important; border-radius:10px !important; font-family:"Noto Sans KR","Noto Sans CJK KR",sans-serif; font-weight:700;
  background: linear-gradient(180deg, rgba(40,36,44,.93), rgba(24,22,28,.93)) padding-box, linear-gradient(180deg, #f6e0a0, #a06a10) border-box !important; box-shadow:0 3px 8px rgba(0,0,0,.45); }
.controls:not(.mobile) .actions { transform:scale(.95); }
.resbar { border:2px solid #d6ac54; background:rgba(24,22,28,.9); }
.target, .prompt { font-weight:700; }
@media (max-width: 900px), (max-height: 520px) { .tracker { width:300px; } .topright { min-width:0; } .expbar { width:60vw; } }
