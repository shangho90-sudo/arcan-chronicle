<!DOCTYPE html>

<style>
@font-face { font-family: Galmuri11; src: url(assets/fonts/Galmuri11.woff) format("woff"); font-display: block; }
:root { --ivory:#faf4e4; --ivory2:#ece2cc; --teal:#287f80; --teal-d:#18565c; --gold:#d6ac54; --gold-d:#a06a10; --ink:#3a2f25; --muted:#8a7a66; --red:#c04a3c; --good:#2f9a52; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:#1c2a26; font-family: Galmuri11, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; }

button { font-family:inherit; }
small { font-size:.8em; }
.small { font-size:.82em; line-height:1.5; }
.muted { color:var(--muted); } .goldtxt { color:var(--gold-d); } .tealtxt { color:var(--teal); } .bad { color:var(--red); } .good { color:var(--good); }
.panel { border:12px solid transparent; border-image:url(assets/ui/panel.png) 6 fill / 12px stretch; image-rendering:pixelated; }
.panel-dark { background:rgba(20,40,44,.88); border:2px solid rgba(214,172,84,.55); border-radius:4px; color:var(--ivory); }
.slotbg { border:8px solid transparent; border-image:url(assets/ui/slot.png) 5 fill / 8px stretch; image-rendering:pixelated; }
.btn { border:8px solid transparent; border-image:url(assets/ui/btn_teal.png) 6 fill / 10px stretch; image-rendering:pixelated; background:none; color:#fff; font-size:20px; padding:6px 16px; cursor:pointer; text-shadow:0 2px 0 rgba(0,0,0,.35); min-height:52px; white-space:nowrap; }
.btn.gold { border-image-source:url(assets/ui/btn_gold.png); color:#3a2408; text-shadow:none; }

.btn.red { border-image-source:url(assets/ui/btn_red.png); }
.btn:hover:not(:disabled) { filter:brightness(1.1); } .btn:active:not(:disabled) { transform:translateY(2px); }

/* ---------- HUD ---------- */
.hud { font-size:15px; }
.charpanel { position:absolute; left:12px; top:12px; width:330px; padding:10px 12px 10px 74px; }
.badge { position:absolute; left:10px; top:10px; width:54px; height:54px; border-radius:50%; border:3px solid var(--gold); overflow:hidden; background:#e9dcc0 no-repeat; background-size:160px auto; background-position:-61px -40px; }
.badge span { position:absolute; right:-1px; bottom:-1px; width:22px; height:22px; border-radius:50%; background:rgba(20,40,44,.92); border:2px solid var(--gold); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; }
.lv { position:absolute; left:8px; top:66px; width:58px; text-align:center; color:var(--gold); font-size:14px; }
.cname { font-size:17px; margin-bottom:5px; } .cname small { color:var(--gold); margin-left:4px; }
.bar { position:relative; height:18px; background:url(assets/ui/bar_bg.png); background-size:100% 100%; image-rendering:pixelated; border-radius:2px; overflow:hidden; margin-top:4px; }

.bar.hp i { background:linear-gradient(#ef6a5a,#b8382c); } .bar.hp b { background:rgba(140,230,255,.55); }
.bar.sp i { background:linear-gradient(#5aaedf,#2b6fa8); }
.bar.boss i { background:linear-gradient(#b86ae0,#6e2c9a); }
.bar span { position:relative; display:block; text-align:center; font-size:12px; line-height:18px; color:#fff; text-shadow:0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
.status { font-size:12px; margin-top:4px; min-height:0; }
.menubtns { display:flex; gap:4px; } .menubtns .btn { font-size:15px; min-height:40px; padding:2px 10px; }
.target { position:absolute; left:50%; top:12px; transform:translateX(-50%); width:360px; padding:6px 10px; text-align:center; font-size:14px; pointer-events:none; }
.target.boss { width:520px; font-size:16px; } .target.boss .bar { height:22px; } .target.boss .bar span { line-height:22px; }
.prompt { position:absolute; left:50%; bottom:190px; transform:translateX(-50%); padding:8px 16px; font-size:16px; pointer-events:none; }
.prompt b { color:var(--gold); }
.expbar { position:absolute; left:0; right:0; bottom:0; height:16px; background:rgba(20,30,34,.85); pointer-events:none; }
.expbar i { position:absolute; left:0; top:3px; bottom:3px; background:linear-gradient(#e8cf7a,#b78d2e); transition:width .2s; }
.expbar span { position:relative; display:block; text-align:center; font-size:11px; line-height:16px; color:#fff; text-shadow:0 1px 0 #000; }

/* ---------- action buttons / stick ---------- */
.actions { position:absolute; right:18px; bottom:28px; width:330px; height:300px; pointer-events:none; }
.abtn { position:absolute; pointer-events:auto; border-radius:50%; background:url(assets/ui/circle_skill.png) center/100% 100%; image-rendering:pixelated; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:none; }

.abtn .key { position:absolute; left:-2px; top:-4px; background:rgba(20,40,44,.9); color:var(--gold); font-size:11px; padding:1px 4px; border-radius:3px; pointer-events:none; }
.abtn .sub { position:absolute; bottom:-4px; right:-2px; color:#9fd4ff; font-size:12px; text-shadow:0 1px 0 #000; pointer-events:none; }
.abtn.big { width:110px; height:110px; right:0; bottom:0; background-image:url(assets/ui/circle_attack.png); }
.abtn.sk { width:78px; height:78px; } .abtn.sm { width:62px; height:62px; background-image:url(assets/ui/circle_small.png); }
.abtn.skill1 { right:122px; bottom:0; } .abtn.skill2 { right:112px; bottom:88px; } .abtn.skill3 { right:36px; bottom:126px; }
.abtn.dodge { right:208px; bottom:6px; } .abtn.potion { right:206px; bottom:96px; } .abtn.interact { right:130px; bottom:184px; }
.controls:not(.mobile) .abtn.big { width:84px; height:84px; } .controls:not(.mobile) .abtn.sk { width:64px; height:64px; } .controls:not(.mobile) .abtn.sm { width:52px; height:52px; }
.controls:not(.mobile) .actions { transform:scale(.82); transform-origin:right bottom; }
.stickarea { position:absolute; left:0; bottom:0; width:42%; height:62%; pointer-events:auto; touch-action:none; }
.stickbase { position:absolute; left:130px; top:auto; bottom:110px; width:150px; height:150px; margin:-75px 0 0 -75px; border-radius:50%; background:url(assets/ui/ring.png) center/100% 100%; opacity:.55; image-rendering:pixelated; }
.stickbase.on { opacity:.9; bottom:auto; }
.knob { position:absolute; left:45px; top:45px; width:60px; height:60px; border-radius:50%; background:url(assets/ui/soft_circle.png) center/100% 100%; }

/* ---------- world labels / floating text ---------- */
.plate { position:absolute; left:0; top:0; text-align:center; white-space:nowrap; font-size:13px; color:#fff; text-shadow:0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
.plate .gold { color:#ffd86b; } .plate .mark { font-size:26px; line-height:1; }
.m-avail { color:#ffd040; } .m-ready { color:#8fe3a0; } .m-active { color:#c8c0b8; }
/* quest marks over NPC heads: big outlined glyph with a glow, gently bobbing, clear gap above the name (2026-11-07) */
.plate .mark:not(:empty) { margin-bottom:14px; }
.plate .mark b.qmark { display:inline-block; animation:qmbob 1.4s ease-in-out infinite; transform-origin:50% 100%; filter:drop-shadow(0 0 6px rgba(255,200,60,.9)) drop-shadow(0 0 14px rgba(255,160,30,.55)); }
.plate .mark b.qmark svg { display:block; }
.plate .mark b.m-active { display:inline-block; font-family:Georgia, "Times New Roman", serif; font-size:54px; font-weight:900; line-height:1; -webkit-text-stroke:2.5px #3a2006; paint-order:stroke fill;
  text-shadow:0 3px 0 #2a1604, 0 0 14px rgba(255,200,60,.85), 0 0 28px rgba(255,170,40,.55); animation:qmbob 1.4s ease-in-out infinite; transform-origin:50% 100%; }
.plate .mark b.m-active { font-size:40px; color:#d8d0c8; text-shadow:0 2px 0 #222; animation:none; }
/* NPC names 3x (13 -> 39 px), thick dark outline so they read over any ground; phones 2x */
@font-face { font-family:Jua; src:url(assets/fonts/Jua.woff2) format('woff2'); font-display:swap; }   /* 주아체, OFL (assets/fonts/Jua-OFL.txt) */
.plate.npc .pname { font-family:Jua, sans-serif; font-size:20px; font-weight:400; letter-spacing:.5px; -webkit-text-stroke:3px #1a1008; paint-order:stroke fill; text-shadow:0 3px 4px rgba(0,0,0,.55); }
.plate.npc .mark:not(:empty) { margin-bottom:10px; }
@media (max-width:600px) { .plate.npc .pname { font-size:14px; -webkit-text-stroke:2.5px #1a1008; } }
@keyframes qmbob { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-7px) scale(1.06); } }
.phb { width:56px; height:6px; margin:2px auto 0; background:#2a2228; border:1px solid #000; } .phb i { display:block; height:100%; background:#e05a4a; }
/* monster plates (always on): name white (your level or lower) / red (stronger), HP bar under it */
.plate.mon .pname { font-size:12.5px; font-weight:700; color:#fff; -webkit-text-stroke:2.5px #120a06; paint-order:stroke fill; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.plate.mon .pname.strong { color:#ff5040; }
.plate.mon .phb { width:60px; height:6px; border-radius:3px; border:1px solid #140c08; background:#2a1c1c; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.5); margin-top:3px; }
.plate.mon .phb i { background:linear-gradient(#ff8a70, #d8342a); border-radius:2px; }
/* monster-kill reward stack (js/rewardfx.js RewardStack): EXP (white-blue, navy shadow, gold ornaments) above gold (gold-orange) */
.rwstack { position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; white-space:nowrap; will-change:transform,opacity; }
.rwstack b { font-family:ArcanSerif, Georgia, "Times New Roman", serif; font-style:italic; font-weight:900; letter-spacing:.5px; display:inline-block; -webkit-background-clip:text; background-clip:text; color:transparent; }
.rw-exp, .rw-gold { position:relative; display:flex; flex-direction:column; align-items:center; opacity:0; }
.rwstack.show-x .rw-exp, .rwstack.show-g .rw-gold { animation:rwpop .32s ease-out forwards; }
.rw-exp { order:0; filter:drop-shadow(0 2px 0 #0d1a3a) drop-shadow(0 0 1.5px #0d1a3a) drop-shadow(0 0 7px rgba(140,200,255,.55)); }
.rw-exp b { font-size:34px; background-image:linear-gradient(#ffffff 15%, #d6f0ff 50%, #7cc4ff 85%); -webkit-text-stroke:1px rgba(20,40,90,.55); }
.rw-gold { order:1; filter:drop-shadow(0 2px 0 #3a1c06) drop-shadow(0 0 1.5px #2a1404) drop-shadow(0 0 7px rgba(255,180,60,.5)); }
.rw-gold b { font-size:38px; background-image:linear-gradient(#fff6c8 10%, #ffd04a 48%, #f08a18 88%); -webkit-text-stroke:1px rgba(90,40,4,.6); }
.rw-gold small { font-size:20px; }
.rw-orn { display:block; width:150px; height:9px; margin:1px 0; background:linear-gradient(90deg, transparent, rgba(255,214,120,.95) 30%, rgba(255,240,190,1) 50%, rgba(255,214,120,.95) 70%, transparent) center/100% 1.5px no-repeat; position:relative; }
.rw-orn::after { content:""; position:absolute; left:50%; top:50%; width:7px; height:7px; transform:translate(-50%,-50%) rotate(45deg); background:linear-gradient(135deg, #e8f6ff, #6ab8ff); box-shadow:0 0 0 1px #c8a050, 0 0 6px rgba(140,200,255,.9); }
.rw-orn.g { width:110px; } .rw-orn.g::after { background:linear-gradient(135deg, #fff2c0, #ffb030); box-shadow:0 0 0 1px #8a5a18, 0 0 6px rgba(255,190,80,.9); }
@keyframes rwpop { 0% { opacity:0; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } 100% { opacity:1; transform:scale(1); } }
@media (max-width:600px) { .rw-exp b { font-size:22px; } .rw-gold b { font-size:25px; } .rw-orn { width:110px; } .rw-orn.g { width:80px; } }
.float { position:absolute; left:0; top:0; font-size:20px; white-space:nowrap; text-shadow:0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000; will-change:transform; }

/* ---------- toasts ---------- */
.toasts { position:absolute; left:50%; top:84px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; }

/* ---------- windows ---------- */
.windows { font-size:20px; }
.dim { position:absolute; inset:0; background:rgba(10,16,20,.45); }

.window.dialog, .window.dialog * { font-family:Jua, sans-serif; }
.window.dialog { top:auto; bottom:22px; transform:translateX(-50%); width:min(1180px,96vw) !important; font-size:clamp(15px, 1.6vw, 20px); }
.dname { color:var(--gold-d); font-size:1.15em; margin-bottom:6px; }
.dtext { line-height:1.65; min-height:3.2em; } .reward { color:var(--gold-d); font-size:.85em; margin-top:8px; }

.inventory .wbody { display:flex; gap:16px; }
.invleft { flex:1; display:flex; flex-direction:column; min-width:0; } .invright { width:420px; padding:10px; overflow:auto; }
.grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:6px; }
.slot { position:relative; aspect-ratio:1; border:6px solid transparent; border-image:url(assets/ui/slot.png) 5 fill / 6px stretch; image-rendering:pixelated; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.slot.sel { outline:3px solid var(--gold); } .slot b { position:absolute; right:0; bottom:-4px; font-size:15px; color:#fff; text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000; font-weight:normal; }
.slot em, .shoprow em { position:absolute; left:2px; top:-2px; color:var(--red); font-style:normal; font-size:14px; }
.shoprow em { position:static; }
.invinfo { margin:8px 2px; font-size:16px; display:flex; justify-content:space-between; }
.detail { flex:1; display:flex; gap:10px; padding:10px; min-height:150px; }

.stats { margin-top:12px; } .statgrid { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:16px; margin-top:6px; } .statgrid b { color:var(--teal-d); float:right; font-weight:normal; }
.shop .wbody { display:flex; gap:16px; }
.shoplist { width:520px; display:flex; flex-direction:column; padding:10px; }
.shoprows { flex:1; overflow:auto; display:flex; flex-direction:column; gap:6px; }

.jobcard .btn { margin-top:auto; font-size:18px; }
.second { margin-top:12px; }
.setrow { display:flex; align-items:center; gap:14px; margin-bottom:10px; } .setrow > span { width:220px; } .setrow input { flex:1; accent-color:var(--teal); } .setrow b { width:60px; text-align:right; font-weight:normal; }
.help { margin:10px 0; }
.pbtns { display:flex; gap:10px; justify-content:center; margin-top:10px; } .pbtns .btn { flex:1; }
.ctext { text-align:center; line-height:1.7; padding:10px 0; }
.titlewin { border:none !important; border-image:none !important; background:none; }
.title .wbody { display:flex; flex-direction:column; gap:12px; align-items:stretch; }

/* The supplied artwork stays fully visible at every aspect ratio. */
#loading { position:fixed; inset:0; display:grid; place-items:center; overflow:hidden; background:#142434; color:#fff4da; z-index:10; font-family:"Malgun Gothic",sans-serif; }
#loading::before { content:""; position:absolute; inset:0; background:linear-gradient(#14243488,#14243488),url(assets/ui/loading-screen.png) center/cover; }

/* prologue (js/prologue.js, assets/data/prologue.json): illustrated 서장 before a new character enters the town */
.pl-loading { position:fixed; inset:0; z-index:201; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#080c16; color:#dfc99c; font-family:"Batang", "AppleMyungjo", serif; }
.pl-loading small { font-size:12px; letter-spacing:6px; } .pl-loading p { font-size:clamp(24px, 4vw, 40px); letter-spacing:5px; }
.prologue { position:fixed; inset:0; z-index:200; background:#080c16; overflow:hidden; opacity:0; transition:opacity .8s, background 2.4s; cursor:pointer; user-select:none; -webkit-user-select:none; font-family:"Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color:#f2ebdc; outline:none; }
.prologue.on { opacity:1; }
.prologue.ending { background:rgba(8,4,2,.38); }
.prologue.out { opacity:0; transition:opacity 1.3s; }
.pl-stage, .pl-layer { position:absolute; inset:0; }
.pl-layer { opacity:0; transition:opacity .9s ease; overflow:hidden; } .pl-layer.in { opacity:1; }
.prologue.ending .pl-stage { opacity:0; transition:opacity 2.2s; }
.pl-pan { position:absolute; inset:0; background:center/cover no-repeat; transform-origin:var(--x0) var(--y0); animation:plPan linear forwards; }
.pl-heading { position:absolute; top:max(32px, env(safe-area-inset-top)); left:5vw; pointer-events:none; text-shadow:0 2px 16px #000; transition:opacity .6s; }
.pl-kicker { font-size:11px; letter-spacing:3px; color:#d8c49a; }
.pl-kicker span { margin:0 10px; font-size:10px; }
.pl-title { margin:12px 0 0; font-family:"Batang", "AppleMyungjo", "Noto Serif CJK KR", serif; font-size:clamp(20px, 2.3vw, 32px); letter-spacing:3px; font-weight:400; }
.prologue.ending .pl-heading { opacity:0; }
@keyframes plPan { from { transform:scale(var(--z0)); transform-origin:var(--x0) var(--y0); } to { transform:scale(var(--z1)); transform-origin:var(--x1) var(--y1); } }
.pl-blur { display:none; }
/* portrait phones: the whole picture (fitted to the width, a little above the middle) over a blurred, darkened copy of itself */
@media (orientation: portrait) {
  .pl-blur { display:block; position:absolute; inset:-30px; background:center/cover no-repeat; filter:blur(22px) brightness(.45) saturate(1.2); }
  .pl-pan { inset:auto 0; top:39%; height:calc(100vw * 9 / 16); transform:translateY(-50%); animation-name:plPanP; }
  @keyframes plPanP { from { transform:translateY(-50%) scale(var(--z0)); transform-origin:var(--x0) var(--y0); } to { transform:translateY(-50%) scale(var(--z1)); transform-origin:var(--x1) var(--y1); } }
}
.pl-shade { position:absolute; inset:0; pointer-events:none; background:linear-gradient(rgba(5,9,18,.65), transparent 24%, transparent 55%, rgba(5,9,18,.8)); transition:opacity 1.5s; }
.prologue.ending .pl-shade { opacity:0; }
.pl-fx { position:absolute; width:calc(var(--r) * 2); height:calc(var(--r) * 2); margin:calc(var(--r) * -1) 0 0 calc(var(--r) * -1); border-radius:50%; pointer-events:none; mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(var(--c),.18), rgba(var(--c),.05) 35%, rgba(var(--c),0) 70%); animation:plPulse 5.6s ease-in-out infinite; }
.pl-fx.slow { animation-duration:4.2s; }
.pl-fx.flash { animation:plPulse 6s ease-in-out infinite; }
.pl-fx.heart { animation:plHeart 6.4s ease-in-out infinite; background:radial-gradient(circle, rgba(var(--c),.24), rgba(var(--c),.08) 30%, rgba(var(--c),0) 68%); }
@keyframes plPulse { 0%, 100% { opacity:.35; transform:scale(.85); } 50% { opacity:1; transform:scale(1.08); } }
@keyframes plFlash { 0%, 100% { opacity:.25; transform:scale(.8); } 8% { opacity:1; transform:scale(1.15); } 20% { opacity:.4; } 30% { opacity:.9; } }
@keyframes plHeart { 0%, 60%, 100% { opacity:.15; transform:scale(.9); } 10% { opacity:.95; transform:scale(1.06); } 22% { opacity:.4; } 32% { opacity:.8; transform:scale(1.03); } }
.pl-tw { position:absolute; width:4px; height:4px; margin:-2px; border-radius:50%; background:#fff; box-shadow:0 0 6px 2px rgba(255,236,190,.8); animation:plTw 3.4s ease-in-out infinite; opacity:0; }
@keyframes plTw { 0%, 100% { opacity:0; } 50% { opacity:.9; } }

<script>
// Run before module evaluation so failed imports cannot leave a silent 0% screen.
(() => {
  const message = document.getElementById('loadmsg');
  const text = document.createElement('span');
  text.textContent = '게임 엔진 불러오는 중...';
  message.replaceChildren(text);
  const retry = document.createElement('button');
  retry.type = 'button'; retry.textContent = '다시 시도'; retry.hidden = true;
  retry.style.cssText = 'margin-left:12px;padding:6px 12px;border:1px solid #e6c780;border-radius:6px;background:#fff0c9;color:#263543;cursor:pointer';
  retry.onclick = () => location.reload();
  message.append(retry);
  let failed = false;
  let slowTimer;
  window.showStartupFailure = error => {
    failed = true; clearTimeout(slowTimer);
    const current = document.getElementById('loadmsg');
    if (!current) return;
    current.replaceChildren(text, retry);
    text.textContent = '불러오기 실패: ' + (error && error.message || '게임 파일을 가져오지 못했습니다. 연결을 확인해 주세요.');
    retry.hidden = false;
    document.getElementById('loading')?.setAttribute('aria-busy', 'false');
  };
  slowTimer = setTimeout(() => {
    if (!document.getElementById('loading') || failed) return;
    const current = document.getElementById('loadmsg');
    if (current) {
      text.textContent = current.textContent + ' 연결이 지연되고 있습니다. 잠시 기다리거나 다시 시도해 주세요.';
      current.replaceChildren(text, retry); retry.hidden = false;
    }
  }, 30000);
  import('./js/game.js').catch(window.showStartupFailure);
})();
</script>
